name: Foundry Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v0.1.10'
        required: true
        type: string
      dry_run:
        description: 'Validate with Foundry without saving the release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_TAG: ${{ inputs.tag || '' }}
      DISPATCH_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
    steps:
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${DISPATCH_TAG}"
          fi
          if [ -z "${tag}" ]; then
            echo "Missing release tag" >&2
            exit 1
          fi
          git fetch --tags --force
          git checkout "${tag}"
          release_sha="$(git rev-parse HEAD)"
          version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('module.json', 'utf8')).version)")"
          expected_tag="v${version}"
          if [ "${tag}" != "${expected_tag}" ]; then
            echo "Tag ${tag} does not match module.json version ${version}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate manifest URLs
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.TAG;
          const version = process.env.VERSION;
          const expectedManifest = `https://github.com/${repo}/releases/latest/download/module.json`;
          const expectedDownload = `https://github.com/${repo}/releases/download/${tag}/rollcodex-v${version}.zip`;
          const errors = [];
          if (manifest.manifest !== expectedManifest) errors.push(`manifest must be ${expectedManifest}`);
          if (manifest.download !== expectedDownload) errors.push(`download must be ${expectedDownload}`);
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Build Foundry zip
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          zip_name="rollcodex-v${VERSION}.zip"
          rm -f "${zip_name}"
          zip -r "${zip_name}" module.json lang scripts styles templates
          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"

      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          RollCodex Foundry module ${VERSION}.

          Install manifest:
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json
          EOF
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" module.json "${ZIP_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" module.json "${ZIP_NAME}" --repo "${GITHUB_REPOSITORY}" --target "${RELEASE_SHA}" --title "RollCodex ${VERSION}" --notes-file release-notes.md
          fi

      - name: Publish release to Foundry
        if: env.FOUNDRY_RELEASE_TOKEN != ''
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          const dryRun = process.env.EVENT_NAME === 'workflow_dispatch' && process.env.DISPATCH_DRY_RUN === 'true';
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.TAG;
          const body = {
            id: manifest.id,
            'dry-run': dryRun,
            release: {
              version: manifest.version,
              manifest: `https://github.com/${repo}/releases/download/${tag}/module.json`,
              notes: `https://github.com/${repo}/releases/tag/${tag}`,
              compatibility: manifest.compatibility || {},
            },
          };
          const response = await fetch('https://foundryvtt.com/_api/packages/release_version/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: process.env.FOUNDRY_RELEASE_TOKEN,
            },
            body: JSON.stringify(body),
          });
          const text = await response.text();
          if (!response.ok) {
            console.error(text);
            throw new Error(`Foundry release API failed with HTTP ${response.status}`);
          }
          console.log(text);
          NODE

      - name: Warn when Foundry token is missing
        if: env.FOUNDRY_RELEASE_TOKEN == ''
        run: |
          echo "FOUNDRY_RELEASE_TOKEN is not configured. GitHub release assets were published, but Foundry was not notified."
